; Alembic 마이그레이션 도구 설정.
;
; 본 INI 는 hub-service 의 스키마 마이그레이션 진입점(migrations/env.py)이
; 참조하는 기본 설정값을 정의한다.
;
; 주의: sqlalchemy.url 은 본 파일에 비워 두고, env.py 가 환경변수
; HUB_DATABASE_URL 을 읽어 set_main_option 으로 주입한다. 자격증명을
; 평문으로 커밋하지 않기 위함이다.

; [alembic] — Alembic 본체 설정
;   script_location: 마이그레이션 환경 디렉터리(env.py 가 있는 위치)
;   version_locations: 개별 revision 파일이 들어가는 디렉터리
;   prepend_sys_path: env.py 에서 app.* 임포트가 가능하도록 cwd 를 sys.path 에 추가
;   version_path_separator: 여러 version_locations 를 OS 기본 구분자로 분리
;   sqlalchemy.url: env.py 에서 동적으로 채운다(빈 값)
[alembic]
script_location = migrations
version_locations = %(here)s/migrations/revisions
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

; === 로깅 설정 ===
; Alembic 표준 logging 규약에 따른 logger / handler / formatter 정의.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

; root — 전 로거의 fallback. 컨테이너 환경에서 과도한 출력 방지를 위해 WARNING.
[logger_root]
level = WARNING
handlers = console
qualname =

; sqlalchemy.engine — SQL 실행 로그. 디버그 시 INFO 로 올려 SQL 을 볼 수 있다.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

; alembic — 마이그레이션 진행 상황을 INFO 레벨로 출력.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

; handler_console — stderr 로 출력하는 StreamHandler.
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

; formatter_generic — 로거 이름과 레벨, 메시지를 짧게 표시.
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
